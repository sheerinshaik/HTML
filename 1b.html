<html>
<pre>
- href defines the destination.
- target defines the opening behavior (same tab, new tab, etc.).
</pre>
<h4>working of "href" attribute</h4>
<a href = "https://google.com/" target="_blank">click here(new tab)
<br>
<a href = "https://google.com/" target="_self">click here(same tab)
</html>
